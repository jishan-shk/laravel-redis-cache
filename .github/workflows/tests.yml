name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        php: [8.3]
        laravel: [10, 11, 12, 13]
        client: [phpredis, predis]
        include:
          - laravel: 10
            testbench: ^8.0
          - laravel: 11
            testbench: ^9.0
          - laravel: 12
            testbench: ^10.0
          - laravel: 13
            testbench: ^11.0

    name: Laravel ${{ matrix.laravel }} - ${{ matrix.client }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          coverage: none

      - name: Install dependencies
        run: composer require --dev -W --no-interaction "orchestra/testbench:${{ matrix.testbench }}" "illuminate/cache:^${{ matrix.laravel }}.0"

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: ${{ matrix.client }}
